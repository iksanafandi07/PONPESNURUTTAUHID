.nv{display:flex;gap:16px;flex:1;font-size:12px;font-weight:600;flex-wrap:wrap}.nv a{color:var(--mu)}.nv a:hover{color:var(--g)}
.dd{position:relative}.dm{display:none;position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;min-width:150px;flex-direction:column;box-shadow:0 8px 24px #0002}.dd:hover .dm{display:flex}.dm a{padding:6px 10px}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--g);color:#fff;display:inline-block;font-size:13px}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--r)}.btn.k{background:var(--dk)}.btn.b{background:#4f46e5}.btn.s{padding:6px 12px;font-size:12px}.btn.w{width:100%;text-align:center}
.hero{text-align:center;padding:90px 20px 70px;background:linear-gradient(#e3eadf,var(--bg));min-height:420px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:14px 0;font-weight:800}.hero h1 span{color:var(--g);display:block}
.pill{display:inline-block;background:#dcf5e8;color:var(--gd);font-size:9px;font-weight:800;border-radius:99px;padding:3px 10px;letter-spacing:.04em}.pill.r{background:#fde6d8;color:var(--r)}
.wrap{max-width:1040px;margin:0 auto;padding:30px 20px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.th{height:120px;border-radius:10px;margin-bottom:10px;background:linear-gradient(135deg,hsl(var(--h) 35% 72%),hsl(var(--h) 40% 32%));padding:8px}
h2{font-size:22px;margin:0 0 6px}h3{margin:0 0 4px;font-size:14px}.mu{color:var(--mu)}.lk{color:var(--g);font-weight:800;font-size:12px}.ctr{text-align:center}
label{display:block;font-size:10px;font-weight:800;margin:12px 0 4px;color:var(--mu);letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.chips{display:flex;gap:8px}.chips button{flex:1;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);font-weight:800;cursor:pointer}
.pg{height:7px;border-radius:9px;background:var(--bd);overflow:hidden}.pg i{display:block;height:100%;width:5.7%;background:var(--au)}
.ft{background:var(--dk);color:#94a3b8;padding:34px 20px;margin-top:30px;font-size:12px}.ft .grid{max-width:1040px;margin:auto}.ft b{color:#fff;display:block;margin-bottom:6px}
.term{background:#070b14;color:#cbd5e1;border-radius:14px;padding:30px;font-family:ui-monospace,Menlo,monospace}.term input,.term select{background:#0f1626;border-color:#1f2a44;color:#fff}.term label{color:#34d399}.term h2{color:#fff}
.ap{display:flex;min-height:100vh;background:linear-gradient(120deg,var(--bg),#fff1e6 90%)}.sb{width:200px;background:var(--card);border-right:1px solid var(--bd);padding:12px 10px;flex:none;display:flex;flex-direction:column;gap:2px;font-size:12px}
.sb small{font-size:9px;font-weight:800;color:var(--mu);margin:10px 8px 2px}.sb a,.sb summary{padding:8px 10px;border-radius:8px;font-weight:600;color:var(--tx);cursor:pointer;display:block}.sb a.on{background:var(--r);color:#fff;box-shadow:inset 3px 0 var(--au)}.sb details a{padding-left:24px;color:var(--mu)}
.sb .lo{margin-top:auto;background:#fde6d8;color:var(--r);font-weight:800}
.mn{flex:1;min-width:0;padding:0 22px 22px}.tb{display:flex;justify-content:flex-end;gap:8px;align-items:center;padding:10px 0;font-size:11px;font-weight:800}.tb em{background:var(--r);color:#fff;border-radius:99px;padding:1px 8px;font-style:normal;font-size:9px}

<script>
const $=s=>document.querySelector(s);let role="Administrator",user=null,R="beranda";

try{Object.assign(S,JSON.parse(localStorage.getItem("pk")||"{}"))}catch(e){}

const NAME={Administrator:"Admin",Pengurus:"PENGURUS",Santri:"SANTRI"};

const D0={reg:[["PRIKITIW","L","Disetujui","ISI SENDIRI"],["ABDUL MUIZ","L","Disetujui","ISI SENDIRI"],["NADIA MAHARANI NIH","P","Disetujui","ISI SENDIRI"],["MUHAMMAD ROBY","L","Pending","ISI SENDIRI"]],ber:[["KUNJUNGAN RELIGI","27 Mei 2026","Ziarah Ke Pamijahan","Kunjungan religi santri.","Santri berziarah bersama pengurus pondok."],["KEGIATAN PESANTREN","24 Mei 2026","Semangat Ziarah Tahunan Santri","Kegiatan ziarah tahunan pondok.","Ziarah tahunan mengunjungi makam para wali."],["KEGIATAN PESANTREN","24 Mei 2026","Khidmat dan Meriah, Pondok Gelar Maulid","Menumbuhkan kecintaan kepada Rasulullah SAW.","Peringatan Maulid Nabi Muhammad SAW."]],don:[["Hamba Allah","12 Nov 2026","300000"],["Hamba Allah","10 Nov 2026","200000"]],mau:[["MUHAMMAD ROBY","27 Mei 2026","130000"],["ABDUL ARIFIN","26 Mei 2026","130000"],["ALI RUDARMAN","24 Mei 2026","130000"]],adm:[],rek:[["BNI","0987654321","Infaq Pesantren"],["BCA","888-876332-99","Infaq Pesantren"]],gal:[["Aktifitas Pesantren","Kajian Kitab"],["Pimpinan Pondok","Lainnya"]],vid:[["Memperingati Maulid Nabi",""],["Memperingati 17 Agustus",""]],tes:[["ABDULLAH","2020","Selama menempuh pendidikan di pesantren, saya merasakan banyak manfaat.",""]]};

const BD={reg:v=>v[0]?[v[0].toUpperCase(),v[1]=="Perempuan"?"P":"L","Pending",v[3]||"-"]:"Nama wajib diisi",
don:v=>+v[0]>0?[v[1]||"Hamba Allah",T(),v[0]]:"Isi nominal donasi",
mau:v=>v[0]&&v[0][0]!="-"&&+v[1]>0?[v[0],T(),v[1]]:"Pilih nama santri dan isi jumlah",
rek:v=>v[0]&&v[1]?[v[0],v[1],v[2]||"-"]:"Bank dan nomor rekening wajib diisi",
gal:v=>v[0]?[v[0],v[1]]:"Judul wajib diisi",vid:v=>v[0]?[v[0],v[2]]:"Judul wajib diisi",

ber:v=>v[2]?[v[0],v[1]||T(),v[2],v[3],v[4]]:"Judul berita wajib diisi"};

async function login(){const u=$("#lu").value.trim().toLowerCase(),p=$("#lp").value,e=$("#le");if(!(window.crypto&&crypto.subtle)){e.textContent="Browser tidak mendukung login. Buka lewat https.";return}const h=await hs(u,p),a=all().find(x=>x.u==u&&x.h==h);if(!a){e.textContent="Username atau password salah.";return}role=a.role;NAME[role]=a.nama;user=a;try{sessionStorage.setItem("pku",a.u)}catch(x){}location.hash="#dashboard";go()}

const stat=a=>`<div class="grid">${a.map(s=>`<div class="c"><small class="mu">${s[0]}</small><div class="st">${s[1]}</div></div>`).join("")}</div>`;
const AD={
dashboard:()=>`<div class="hb"><div><span class="pill r">DASHBOARD ${role.toUpperCase()}</span><h1>Selamat Datang,<br><span>${E(NAME[role])}</span></h1><p class="mu">Kelola pendaftaran, keuangan, galeri, dan berita dalam satu sistem.</p><a class="btn r s" href="#iuran">Iuran Maulid</a> <a class="btn o s" href="#data">Data Santri</a></div><span class="lg">BK</span></div>`+stat([["TOTAL SANTRI",D.reg.length],["DONASI MASUK",Rp(sum(D.don))],["ARTIKEL BERITA",D.ber.length],["STATUS","Online"]]),
data:()=>`<div class="tb" style="justify-content:space-between"><h2>MANAJEMEN DATA PENDAFTARAN</h2><span><button class="btn k s" onclick="print()">Cetak PDF</button> <button class="btn r s" onclick="addReg()">Tambah Pendaftaran</button></span></div>${stat([["TOTAL",D.reg.length],["PENDING",D.reg.filter(r=>r[2]=="Pending").length],["DISETUJUI",D.reg.filter(r=>r[2]=="Disetujui").length],["DITOLAK",D.reg.filter(r=>r[2]=="Ditolak").length]])}<div class="c" style="margin:10px 0"><input placeholder="Cari nama santri..." oninput="flt(this.value)"></div>`+TB(["NO","DATA SANTRI","DATA WALI","STATUS","AKSI"],D.reg.map((r,i)=>`<tr><td>${i+1}</td><td><b>${E(r[0])}</b><br><small class="mu">${r[1]=="L"?"Laki-laki":"Perempuan"}</small></td><td>${E(r[3])}</td><td>${B(r[2])}</td><td>${AC("reg",i)}</td></tr>`))+EM(D.reg),
donasi:()=>`<h2>Data Donasi Masuk</h2><div class="rc"><small>TOTAL DONASI</small><div class="st">${Rp(sum(D.don))}</div></div>`+TB(["DONATUR","TANGGAL","NOMINAL","AKSI"],D.don.map((r,i)=>`<tr><td>${E(r[0])}</td><td>${E(r[1])}</td><td>${Rp(r[2])}</td><td>${AC("don",i)}</td></tr>`))+EM(D.don),
rekening:()=>`<h2>Manajemen Rekening</h2><p class="mu">Rekening ini tampil di halaman Donasi.</p><div class="grid">${D.rek.map((r,i)=>`<div class="rc"><b>${E(r[0])}</b><div class="st">${E(r[1])}</div>a.n. ${E(r[2])}<p>${AC("rek",i)}</p></div>`).join("")}</div>${EM(D.rek)}<div class="c" id="fr"><b>Tambah rekening baru</b>${F("NAMA BANK / E-WALLET","text","BCA")}${F("NOMOR REKENING","text","888-876332-99")}${F("ATAS NAMA","text","Nama pemilik")}<p><button class="btn k w" onclick="add('rek','#fr','Rekening ditambahkan')">Simpan Data Rekening</button></p></div>`,
maulid:()=>`<div class="paper"><h3>${E(S.nama)}</h3><p class="ctr"><b>LAPORAN IURAN MAULID</b></p>${TB(["No","Nama Santri","Tanggal Bayar","Nominal","Aksi"],D.mau.map((r,i)=>`<tr><td>${i+1}</td><td>${E(r[0])}</td><td>${E(r[1])}</td><td>${Rp(r[2])}</td><td>${AC("mau",i)}</td></tr>`))}${EM(D.mau)}<p style="text-align:right"><b>TOTAL: ${Rp(sum(D.mau))}</b></p></div><p class="ctr"><button class="btn k" onclick="print()">Cetak laporan</button></p>`,
iuran:()=>`<h2>Input Iuran Maulid</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="c" id="fi">${F("PILIH NAMA SANTRI","select","",["-- Pilih Nama --",...D.reg.map(r=>r[0])])}${F("JUMLAH IURAN (RP)","number","150000")}${F("BUKTI TRANSFER","file")}<p><button class="btn r w" onclick="add('mau','#fi','Iuran tersimpan')">Kirim Iuran</button></p></div><div class="dkn"><b>Catatan Operasional</b><p>Data iuran masuk ke Laporan Iuran Maulid di menu Keuangan.</p></div></div>`,
gfoto:()=>`<h2>Input Galeri Dokumentasi</h2><div class="c" id="fg">${F("JUDUL DOKUMENTASI","text","Judul kegiatan")}${F("KATEGORI AKTIVITAS","select","",["Maulid Nabi Muhammad SAW","Kajian Kitab","Lainnya"])}${F("UPLOAD FOTO","file")}<p><button class="btn" onclick="add('gal','#fg','Dokumentasi tersimpan')">Simpan Dokumentasi</button></p></div><br><div class="grid">${D.gal.map((g,i)=>`<div class="c"><div class="th" style="--h:${i*60+110}"></div><h3>${E(g[0])}</h3><p>${AC("gal",i)}</p></div>`).join("")}</div>${EM(D.gal)}`,
gvideo:()=>`<h2>Input Galeri Video</h2><div class="c" id="fvd">${F("JUDUL VIDEO","text","Judul video")}${F("METODE","select","",["Streaming YouTube"])}${F("LINK VIDEO YOUTUBE","text","https://www.youtube.com/watch?v=...")}${F("THUMBNAIL","file")}<p><button class="btn" onclick="add('vid','#fvd','Video tersimpan')">Simpan Video</button></p></div><br>`+TB(["JUDUL","LINK","AKSI"],D.vid.map((v,i)=>`<tr><td>${E(v[0])}</td><td>${E(v[1]||"-")}</td><td>${AC("vid",i)}</td></tr>`))+EM(D.vid),
gtesti:()=>`<h2>Input Testimoni Alumni</h2><div class="c" id="ftt"><div class="grid"><div>${F("FOTO PROFIL ALUMNI","file")}${F("THUMBNAIL VIDEO","file")}</div><div>${F("NAMA ALUMNI","text","Nama alumni")}${F("TAHUN LULUS","text","2020")}${F("TESTIMONI","area","Testimoni...")}${F("LINK YOUTUBE","text","Opsional")}</div></div><p><button class="btn r w" onclick="add('tes','#ftt','Testimoni tersimpan')">Simpan Testimoni</button></p></div><br><div class="grid">${D.tes.map((t,i)=>`<div class="c"><h3>${E(t[0])}</h3><small class="mu">${E(t[1])}</small><p class="mu">${E(t[2])}</p><p>${AC("tes",i)}</p></div>`).join("")}</div>${EM(D.tes)}`,
berita:()=>`<h2>Form Publikasi Berita</h2><div class="grid"><div class="c" id="fb" oninput="lp()">${F("KATEGORI","select","",["Kegiatan Pesantren","Kunjungan Religi","Prestasi","Pengumuman"])}${F("TANGGAL TERBIT","date")}${F("JUDUL BERITA","text","Judul berita")}${F("RINGKASAN","text","Tulis ringkasan")}${F("ISI BERITA LENGKAP","area","Isi berita")}${F("BANNER BERITA","file")}<p><button class="btn w" onclick="add('ber','#fb','Berita terbit')">Publikasikan Berita</button></p></div><div class="c"><small class="pill">LIVE PREVIEW</small><div class="th" style="--h:150;margin-top:8px"></div><h3 id="pv">Judul berita tampil di sini</h3></div></div><h2 style="margin-top:20px">Daftar Berita</h2><div class="grid">${LN().map(x=>`<div class="c"><div class="th" style="--h:${x[1]*45+140}"></div><h3>${E(x[0][2])}</h3><p><button class="btn k s" onclick="bc(${x[1]})">Lihat Detail</button> ${AC("ber",x[1])}</p></div>`).join("")}</div>${EM(D.ber)}`,
surat:()=>`<h2>Cetak Surat</h2><div class="paper"><h3>${E(S.nama)}</h3><p>Hal : Permohonan Infaq &amp; Sedekah Jariyah<br>Kepada Yth. Bapak/Ibu Donatur di Tempat</p><p><i>Assalamu'alaikum Warahmatullahi Wabarakatuh,</i></p><p>Dengan hormat, kami mengajukan permohonan infaq pembangunan sarana belajar santri.${D.rek[0]?` Donasi dapat disalurkan ke ${E(D.rek[0][0])} ${E(D.rek[0][1])} a.n. ${E(D.rek[0][2])}.`:""}</p><p style="text-align:right">Pimpinan Pondok</p></div><p class="ctr"><button class="btn k" onclick="print()">Cetak surat</button></p>`,
cara:()=>`<h2>Cara Penggunaan</h2><div class="c"><ol><li>Login dengan username dan password.</li><li>Pilih menu di sidebar.</li><li>Isi formulir lalu simpan.</li><li>Gunakan tombol Edit atau Hapus pada tiap data.</li><li>Logout setelah selesai.</li></ol></div>`,
admin:()=>`<div class="tb" style="justify-content:space-between"><h2>Manajemen Admin</h2><span><button class="btn k s" onclick="print()">Cetak PDF</button> <button class="btn s" onclick="csv()">Excel</button> <button class="btn b s" onclick="addAdm()">+ Tambah Admin</button></span></div><div class="c" style="margin-bottom:10px"><input placeholder="Cari nama atau username..." oninput="flt(this.value)"></div>`+TB(["ADMINISTRATOR","KATEGORI","STATUS","AKSI"],[`<tr><td><b>IKHSAN AFANDI</b><br><small class="mu">ikhsan afandi</small></td><td>Administrator</td><td>${B("Aktif")}</td><td class="mu">Akun utama</td></tr>`,...D.adm.map((r,i)=>`<tr><td><b>${E(r[0])}</b><br><small class="mu">${E(r[1])}</small></td><td>${E(r[2])}</td><td>${B(r[3])}</td><td>${AC("adm",i)}</td></tr>`)]),
pengaturan:()=>`<h2>Profil &amp; Pengaturan Pondok</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="c">${SF("nama","NAMA PONDOK PESANTREN",S.nama)}${SF("sub","SUBJUDUL",S.sub)}${SF("alamat","ALAMAT PONDOK",S.alamat,1)}${SF("email","EMAIL",S.email)}${SF("tel","TELEPON",S.tel)}<p><button class="btn r" onclick="saveSet()">Simpan pengaturan</button> <button class="btn k" onclick="unduh()">Unduh index.html terbaru</button></p><p class="mu" style="font-size:11px">Simpan hanya berlaku di browser ini. Untuk menampilkan ke semua pengunjung, unduh file terbaru lalu upload ke GitHub (data santri, donasi, dan iuran tidak ikut diunduh).</p></div><div class="c ctr"><b>Preview Sistem</b><br><span class="lg" style="margin:12px auto;width:90px;height:90px">BK</span><br><b>${E(S.nama)}</b><br><small class="mu">${E(S.email)}<br>${E(S.tel)}</small></div></div>`};
const SB=[["dashboard","Dashboard"],["data","Data Santri"],["Keuangan",[["donasi","Donasi"],["rekening","Rekening"],["maulid","Maulid"]]],["iuran","Iuran Maulid"],["Galeri",[["gfoto","Foto"],["gvideo","Video"],["gtesti","Testimoni"]]],["berita","Berita"],["Cetak Surat",[["surat","Surat Infaq"]]],["cara","Cara Penggunaan"]];
const SAN=["dashboard","iuran","Galeri","cara"];
function side(X){const L=(k,t)=>`<a href="#${k}"${k==X?' class="on"':""}>${t}</a>`;let h=`<aside class="sb"><div class="logo" style="padding:6px 8px 10px"><span class="lg">BK</span><span>${E(S.nama.split(" ")[0])}<small>${E(S.sub)}</small></span></div><small>MENU UTAMA</small>`;
SB.filter(x=>role!="Santri"||SAN.includes(x[0])).forEach(x=>{h+=Array.isArray(x[1])?`<details${x[1].some(y=>y[0]==X)?" open":""}><summary>${x[0]}</summary>${x[1].map(y=>L(y[0],y[1])).join("")}</details>`:L(x[0],x[1])});
if(role=="Administrator")h+=`<small>PENGATURAN KONTEN</small>${L("admin","Manajemen Admin")}${L("pengaturan","Profil Pondok")}`;
return h+`<a class="lo" onclick="logout()">⏻ Logout</a></aside>`}
function go(){R=location.hash.slice(1)||"beranda";let h;const no=role!="Administrator"&&(R=="admin"||R=="pengaturan");
if(AD[R]&&user&&!no)h=`<div class="ap">${side(R)}<main class="mn"><div class="tb"><a href="#pengaturan">${E(NAME[role])}</a> <em>${role.toUpperCase()}</em></div>${AD[R]()}</main></div>`;
else{if(!PUB[R])R=AD[R]?"login":"beranda";h=PUB[R]()}
$("#app").innerHTML=h;scrollTo(0,0)}
addEventListener("hashchange",go);go();
</script></body></html>
