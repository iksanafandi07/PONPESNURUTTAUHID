.nv{display:flex;gap:16px;flex:1;font-size:12px;font-weight:600;flex-wrap:wrap}.nv a{color:var(--mu)}.nv a:hover{color:var(--g)}
.dd{position:relative}.dm{display:none;position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;min-width:150px;flex-direction:column;box-shadow:0 8px 24px #0002}.dd:hover .dm{display:flex}.dm a{padding:6px 10px}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--g);color:#fff;display:inline-block;font-size:13px}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--r)}.btn.k{background:var(--dk)}.btn.b{background:#4f46e5}.btn.s{padding:6px 12px;font-size:12px}.btn.w{width:100%;text-align:center}
.hero{text-align:center;padding:90px 20px 70px;background:linear-gradient(#e3eadf,var(--bg));min-height:420px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.1;margin:14px 0;font-weight:800}.hero h1 span{color:var(--g);display:block}
.pill{display:inline-block;background:#dcf5e8;color:var(--gd);font-size:9px;font-weight:800;border-radius:99px;padding:3px 10px;letter-spacing:.04em}.pill.r{background:#fde6d8;color:var(--r)}
.wrap{max-width:1040px;margin:0 auto;padding:30px 20px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.th{height:120px;border-radius:10px;margin-bottom:10px;background:linear-gradient(135deg,hsl(var(--h) 35% 72%),hsl(var(--h) 40% 32%));padding:8px}
h2{font-size:22px;margin:0 0 6px}h3{margin:0 0 4px;font-size:14px}.mu{color:var(--mu)}.lk{color:var(--g);font-weight:800;font-size:12px}.ctr{text-align:center}
label{display:block;font-size:10px;font-weight:800;margin:12px 0 4px;color:var(--mu);letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.chips{display:flex;gap:8px}.chips button{flex:1;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);font-weight:800;cursor:pointer}
.pg{height:7px;border-radius:9px;background:var(--bd);overflow:hidden}.pg i{display:block;height:100%;width:5.7%;background:var(--au)}
.ft{background:var(--dk);color:#94a3b8;padding:34px 20px;margin-top:30px;font-size:12px}.ft .grid{max-width:1040px;margin:auto}.ft b{color:#fff;display:block;margin-bottom:6px}
.term{background:#070b14;color:#cbd5e1;border-radius:14px;padding:30px;font-family:ui-monospace,Menlo,monospace}.term input,.term select{background:#0f1626;border-color:#1f2a44;color:#fff}.term label{color:#34d399}.term h2{color:#fff}
.ap{display:flex;min-height:100vh;background:linear-gradient(120deg,var(--bg),#fff1e6 90%)}.sb{width:200px;background:var(--card);border-right:1px solid var(--bd);padding:12px 10px;flex:none;display:flex;flex-direction:column;gap:2px;font-size:12px}
.sb small{font-size:9px;font-weight:800;color:var(--mu);margin:10px 8px 2px}.sb a,.sb summary{padding:8px 10px;border-radius:8px;font-weight:600;color:var(--tx);cursor:pointer;display:block}.sb a.on{background:var(--r);color:#fff;box-shadow:inset 3px 0 var(--au)}.sb details a{padding-left:24px;color:var(--mu)}
.sb .lo{margin-top:auto;background:#fde6d8;color:var(--r);font-weight:800}
.mn{flex:1;min-width:0;padding:0 22px 22px}.tb{display:flex;justify-content:flex-end;gap:8px;align-items:center;padding:10px 0;font-size:11px;font-weight:800}.tb em{background:var(--r);color:#fff;border-radius:99px;padding:1px 8px;font-style:normal;font-size:9px}

<script>
const $=s=>document.querySelector(s);let role="Administrator";
let S={nama:"NURUT TAUHID",sub:"PONDOK PESANTREN SYALAFI",alamat:"Salamrejo, Banyuwangi, Jawa Timur",email:"-",tel:"-"};
try{Object.assign(S,JSON.parse(localStorage.getItem("pk")||"{}"))}catch(e){}
const SF=(id,l,v,a)=>`<label>${l}</label>`+(a?`<textarea id="s_${id}" rows="3">${v}</textarea>`:`<input id="s_${id}" value="${v.replace(/"/g,"&quot;")}">`);
function saveSet(){["nama","sub","alamat","email","tel"].forEach(k=>{const e=$("#s_"+k);if(e&&e.value.trim())S[k]=e.value.trim()});try{localStorage.setItem("pk",JSON.stringify(S))}catch(e){}go();toast("Berhasil Disimpan")}
const NAME={Administrator:"Admin",Pengurus:"PENGURUS PONDOK",Santri:"SANTRI"};
const ACC=[{u:"ikhsan afandi",h:"09cc2bc3740a74596e79a58de508077a0886b517ce099cb807497b3c9151a4f5",role:"Administrator",nama:"Ikhsan Afandi"}];let user=null;
try{const a=ACC.find(x=>x.u==sessionStorage.getItem("pku"));if(a){user=a;role=a.role;NAME[role]=a.nama}}catch(e){}
const D={reg:[["PRIKITIW","L","Disetujui"],["ABDUL MUIZ","L","Disetujui"],["NADIA MAHARANI NIH","P","Disetujui"],["MUHAMMAD ROBY","L","Pending"]],
ber:[["KUNJUNGAN RELIGI","27 Mei 2026","Ziarah","Ziarah Ke Pamijahan"],["KEGIATAN PESANTREN","24 Mei 2026","Semangat Ziarah Tahunan Santri Pondok Pesantren Nurut Tauhid","Kegiatan ziarah tahunan Pondok Pesantren Nurut Tauhid biasanya mengunjungi makam para wali."],["KEGIATAN PESANTREN","24 Mei 2026","Khidmat dan Meriah, Pondok Pesantren Gelar Maulid","Dalam rangka menumbuhkan kecintaan kepada Rasulullah SAW."]],
adm:[["IKHSAN AFANDI","ikhsan afandi","Administrator","Aktif"]],
mau:[["MUHAMMAD ROBY","27/05/2026","130.000"],["ABDUL ARIFIN","26/05/2026","130.000"],["MUHAMMAD ROBY","24/05/2026","90.000"],["ALI RUDARMAN","24/05/2026","130.000"]]};
const F=(l,t="text",p="",o=[])=>`<label>${l}</label>`+(t=="select"?`<select>${o.map(x=>`<option>${x}</option>`).join("")}</select>`:t=="area"?`<textarea rows="3" placeholder="${p}"></textarea>`:`<input type="${t}" placeholder="${p}">`);

const VG=n=>[...Array(n)].map((_,i)=>`<div><div class="vd" style="--h:${i*50+200}">▶</div><h3 style="margin-top:6px">${["Memperingati Maulid Nabi","Peringatan Maulid","Memperingati 17 Agustus"][i%3]}</h3></div>`).join("");

function del(i){modal(`<div style="font-size:30px">⚠️</div><h3>DESTRUKSI DATA BERKAS</h3><p>Apakah Anda yakin menghapus data pendaftaran <b>${D.reg[i][0]}</b>?</p><button class="btn o s" data-x="1">Batal</button> <button class="btn r s" data-x="ok" onclick="D.reg.splice(${i},1)">Hapus permanen</button>`,1)}
function daftar(){modal(`<h3>Form Pendaftaran</h3><p class="mu">Lengkapi data untuk mendaftar akun baru.</p>${F("NAMA LENGKAP","text","Nama Lengkap")}${F("USERNAME","text","Username")}${F("EMAIL","email","Email")}${F("PASSWORD","password","••••••")}${F("KATEGORI","select","",["-- Pilih Kategori --","Santri","Pengurus","Administrator"])}<p><button class="btn o s" data-x="1">Batal</button> <button class="btn r s" data-x="1" onclick="toast('Akun terdaftar')">Daftar Akun</button></p>`)}
async function login(){const u=$("#lu").value.trim().toLowerCase(),p=$("#lp").value,e=$("#le");
if(!(window.crypto&&crypto.subtle)){e.textContent="Browser tidak mendukung login. Buka lewat https.";return}
const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(u+":"+p)),h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const a=ACC.find(x=>x.u==u&&x.h==h);if(!a){e.textContent="Username atau password salah.";return}
role=a.role;NAME[role]=a.nama;user=a;try{sessionStorage.setItem("pku",a.u)}catch(x){}location.hash="#dashboard"}

const ph=()=>`<header class="hd"><a href="#beranda" class="logo"><span class="lg">BK</span><span>${S.nama}<small>${S.sub}</small></span></a><nav class="nv"><a href="#beranda">Beranda</a><a href="#pimpinan">Pimpinan</a><a href="#berita">Berita</a><span class="dd"><a href="#gfotop">Galeri ▾</a><span class="dm"><a href="#gfotop">Galeri Foto</a><a href="#gvideop">Galeri Video</a><a href="#alumni">Testimoni Alumni</a></span></span><a href="#pendaftaran">Pendaftaran</a><a href="#donasi">Donasi</a><a href="#kontak">Kontak</a></nav><a class="btn o s" href="#login">LOGIN</a><a class="btn s" href="#pendaftaran">PSB ONLINE</a></header>`;

pendaftaran:()=>ph()+`<div class="wrap"><div class="term"><span class="pill">PONDOK PESANTREN NURUT TAUHID</span><h2 style="margin-top:8px">Registrasi &amp; Validasi Berkas</h2><p>Siapkan dokumen asli dalam format digital. Data akan diverifikasi oleh pengurus pondok.</p><div class="grid"><div>${F("[01] DATA IDENTITAS CALON SANTRI")}${F("NAMA LENGKAP SANTRI","text","Nama sesuai ijazah")}${F("JENIS KELAMIN","select","",["Pilih Opsi","Laki-laki","Perempuan"])}${F("NO. WHATSAPP SANTRI","text","+62")}</div><div>${F("[02] DATA ORANG TUA / WALI")}${F("NAMA WALI / ORANG TUA","text","Nama wali")}${F("NO. WHATSAPP WALI","text","+62")}${F("[03] NODE UNGGAHAN BERKAS DIGITAL")}${F("DOKUMEN (JPG, JPEG, PNG · MAKS 2 MB)","file")}</div></div><p><button class="btn" ${sv("Pendaftaran terkirim")}>Kirim registrasi</button></p></div></div>`+ft(),

login:()=>`<div class="sp"><div class="l"><span class="pill" style="width:fit-content;background:#fff3;color:#fff">SECURE LOGIN SYSTEM</span><h1 style="font-size:38px;margin:12px 0">Dashboard Santri Salafiyah</h1><p>Sistem administrasi digital modern untuk santri, pengurus, pimpinan pondok, dan administrator pesantren.</p></div><div class="rt"><div style="width:100%;max-width:340px"><span class="pill r">LOGIN DASHBOARD</span><h2 style="margin-top:8px">Selamat Datang</h2><p class="mu">Masukkan username atau email Anda untuk masuk ke sistem.</p>${F("USERNAME","text","Username").replace("<input",'<input id="lu" autocomplete="username"')}${F("PASSWORD","password","Password").replace("<input",'<input id="lp" autocomplete="current-password" onkeydown="if(event.key==\'Enter\')login()"')}<p id="le" style="color:var(--r);font-size:12px;margin:8px 0 0"></p><p><button class="btn r w" onclick="login()">MASUK KE DASHBOARD</button></p></div></div></div>`,

gvideo:()=>`<h2>Input Galeri Video</h2><div class="c">${F("JUDUL DOKUMENTASI VIDEO","text","Contoh: Tulis judul")}${F("METODE PENYAJIAN MEDIA","select","",["Streaming YouTube","Upload Video Sendiri (.MP4)"])}${F("TAUTAN LINK VIDEO YOUTUBE","text","https://www.youtube.com/watch?v=...")}${F("GAMBAR SAMPUL / THUMBNAIL","file")}<p><button class="btn" ${sv("Arsip dokumentasi tersimpan")}>Simpan Arsip Dokumentasi</button></p></div>`,
gtesti:()=>`<h2>Input Testimoni Alumni</h2><div class="c"><p class="mu"><b>PENTING SEBELUM UPLOAD!</b> Pastikan video alumni berformat horizontal (landscape) agar tampil sempurna di landing page.</p><div class="grid"><div>${F("FOTO PROFIL ALUMNI","file")}${F("GAMBAR THUMBNAIL VIDEO","file")}</div><div>${F("NAMA ALUMNI","text","Nama Alumni")}${F("TAHUN LULUS","text","Tahun Lulus")}${F("TESTIMONI","area","Testimoni...")}${F("LINK YOUTUBE","text","Link YouTube")}</div></div><p><button class="btn r w" ${sv("Testimoni tersimpan")}>Simpan Testimoni</button></p></div>`,
berita:()=>`<h2>Form Publikasi Berita</h2><div class="grid"><div class="c">${F("KATEGORI","select","",["Kegiatan Pesantren","Kunjungan Religi","Prestasi","Pengumuman"])}${F("TANGGAL TERBIT","date")}${F("JUDUL BERITA","text","Judul berita")}${F("RINGKASAN BERITA","text","Tulis ringkasan")}${F("ISI BERITA LENGKAP","area","Isi berita")}${F("UPLOAD BANNER BERITA","file")}<p><button class="btn w" ${sv("Berita terbit")}>Publikasikan Berita</button></p></div><div class="c"><small class="pill">LIVE PREVIEW</small><div class="th" style="--h:150;margin-top:8px"></div><h3>Judul berita otomatis tampil realtime sesuai input admin.</h3></div></div><h2 style="margin-top:20px">Daftar Berita</h2><div class="grid">${D.ber.map((b,i)=>`<div class="c"><div class="th" style="--h:${i*45+140}"></div><h3>${b[2]}</h3><button class="btn k s">Lihat Detail</button> <button class="btn o s">Edit</button> <button class="btn o s">Hapus</button></div>`).join("")}</div>`,
surat:()=>`<h2>Cetak Surat</h2><div class="paper"><h3>PONDOK PESANTREN SALAFIYAH<br>NURUT TAUHID</h3><p>Hal : Permohonan Infaq &amp; Sedekah Jariyah<br>Kepada Yth. Bapak/Ibu Donatur di Tempat</p><p><i>Assalamu'alaikum Warahmatullahi Wabarakatuh,</i></p><p>Dengan segala hormat, kami mengajukan permohonan infaq pembangunan sarana belajar santri. Donasi dapat disalurkan ke BANK BNI 7122-876332-99 a.n. Infaq Pesantren Nurut Tauhid.</p><p style="text-align:right">Pimpinan Pondok</p></div><p class="ctr"><button class="btn k" onclick="print()">Cetak surat</button></p>`,
cara:()=>`<h2>Cara Penggunaan</h2><div class="c"><ol><li>Login sesuai kategori akun.</li><li>Pilih menu di sidebar.</li><li>Isi formulir lalu simpan.</li><li>Logout setelah selesai.</li></ol></div>`,
admin:()=>`<div class="tb" style="justify-content:space-between"><h2>Manajemen Admin</h2><span><button class="btn k s" onclick="print()">Cetak PDF</button> <button class="btn s">Excel</button> <button class="btn b s" onclick="daftar()">+ Tambah Admin</button></span></div><div class="c" style="display:flex;gap:8px"><input placeholder="Cari nama atau username..."><button class="btn b s">Cari</button></div><br>`+TB(["DETAIL ADMINISTRATOR","KATEGORI","STATUS","AKSI"],D.adm.map(r=>`<tr><td><b>${r[0]}</b><br><small class="mu">${r[1]}</small></td><td>${r[2]}</td><td>${B(r[3])}</td><td>✏️ 🗑</td></tr>`)),
pengaturan:()=>`<h2>Profil &amp; Pengaturan Pondok</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div class="c">${SF("nama","NAMA PONDOK PESANTREN",S.nama)}${SF("sub","SUBJUDUL",S.sub)}${SF("alamat","ALAMAT PONDOK",S.alamat,1)}${SF("email","EMAIL",S.email)}${SF("tel","TELEPON",S.tel)}${F("UPLOAD LOGO PONDOK","file")}<p><button class="btn r" onclick="saveSet()">Simpan pengaturan</button> <button class="btn k" onclick="unduh()">Unduh index.html terbaru</button><p class="mu" style="font-size:11px">Simpan hanya berlaku di browser ini. Untuk menampilkan ke semua pengunjung, unduh file terbaru lalu upload ke GitHub.</p></p></div><div class="c ctr"><b>Preview Sistem</b><br><span class="lg" style="margin:12px auto;width:90px;height:90px">BK</span><br><b>${S.nama}</b><br><small class="mu">${S.email}<br>${S.tel}</small></div></div>`};
const SB=[["dashboard","Dashboard"],["data","Data Santri"],["Keuangan",[["donasi","Donasi"],["rekening","Rekening"],["maulid","Maulid"]]],["iuran","Iuran Maulid"],["Galeri",[["gfoto","Foto"],["gvideo","Video"],["gtesti","Testimoni"]]],["berita","Berita"],["Cetak Surat",[["surat","Surat Infaq"]]],["cara","Cara Penggunaan"]];
const SAN=["dashboard","iuran","Galeri","cara"];
function side(R){const L=(k,t)=>`<a href="#${k}"${k==R?' class="on"':""}>${t}</a>`;let h=`<aside class="sb"><div class="logo" style="padding:6px 8px 10px"><span class="lg">BK</span><span>${S.nama.split(" ")[0]}<small>${S.sub}</small></span></div><small>MENU UTAMA</small>`;
SB.filter(x=>role!="Santri"||SAN.includes(x[0])).forEach(x=>{h+=Array.isArray(x[1])?`<details${x[1].some(y=>y[0]==R)?" open":""}><summary>${x[0]}</summary>${x[1].map(y=>L(y[0],y[1])).join("")}</details>`:L(x[0],x[1])});
if(role=="Administrator")h+=`<small>PENGATURAN KONTEN</small>${L("admin","Manajemen Admin")}${L("pengaturan","Profil Pondok")}`;
return h+`<a class="lo" onclick="logout()">⏻ Logout</a></aside>`}
let R="beranda";
function go(){R=location.hash.slice(1)||"beranda";let h;
if(AD[R]&&user&&!(role=="Pengurus"&&(R=="admin"||R=="pengaturan"))&&!(role!="Administrator"&&(R=="admin"||R=="pengaturan")))h=`<div class="ap">${side(R)}<main class="mn"><div class="tb"><a href="#pengaturan">${NAME[role]}</a> <em>${role.toUpperCase()}</em></div>${AD[R]()}</main></div>`;
else{if(!PUB[R])R=AD[R]?"login":"beranda";h=PUB[R]()}
$("#app").innerHTML=h;scrollTo(0,0)}
addEventListener("hashchange",go);go();
</script></body></html>
